apiVersion: v1
kind: ConfigMap
metadata:
  name: tomcat-root-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>ArgoCD Tomcat Test</title>
      <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #2c3e50; }
        .success { color: #27ae60; font-weight: bold; }
      </style>
    </head>
    <body>
      <h1>🚀 恭喜！ArgoCD 部署成功！</h1>
      <p>这是一个通过 <span class="success">Kubernetes + ArgoCD + Tomcat</span> 部署的测试页面。</p>
      <p>当前时间：<script>document.write(new Date().toLocaleString());</script></p>
    </body>
    </html>
