apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      containers:
        - name: tomcat
          image: tomcat:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: root-page
              # 注意这里：直接挂载到具体的文件，而不是目录
              mountPath: /usr/local/tomcat/webapps/ROOT/index.html
              # 关键：使用 subPath 绕开软链接和只读限制
              subPath: index.html
      volumes:
        - name: root-page
          configMap:
            name: tomcat-root-page
